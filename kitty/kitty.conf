# ─────────────────────────────────────────────
# Theme — управляется Noctalia
# ─────────────────────────────────────────────
include themes/noctalia.conf


# ─────────────────────────────────────────────
# Font
# ─────────────────────────────────────────────
font_size 9.0

# Если захочешь явно задать шрифт:
font_family "JetBrainsMono Nerd Font"


# ─────────────────────────────────────────────
# Window
# ─────────────────────────────────────────────
background_opacity 0.85

# Небольшие аккуратные внутренние отступы
window_padding_width 6

# Не рисовать лишние рамки
draw_minimal_borders yes


# ─────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────

# Тонкий вертикальный курсор
cursor_shape beam
cursor_beam_thickness 1.5

# Когда окно неактивно — hollow cursor
cursor_shape_unfocused hollow

# Плавное мигание
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 15

# Красивый animated trail
cursor_trail 1
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 2

# Noctalia сама задаёт цвет trail через themes/noctalia.conf
# cursor_trail_color ...


# ─────────────────────────────────────────────
# Selection / Copy
# ─────────────────────────────────────────────

# Обычное копирование, если нужно сохранить переносы/код
map ctrl+shift+c pass_selection_to_program ~/.config/kitty/copy.sh
# Clean copy
map ctrl+shift+alt+c pass_selection_to_program ~/.config/kitty/clean-copy.sh

map ctrl+shift+v paste_from_clipboard

# ─────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────
scrollback_lines 10000

wheel_scroll_multiplier 3.0


# ─────────────────────────────────────────────
# Mouse / URLs
# ─────────────────────────────────────────────
url_style curly
open_url_with default

mouse_hide_wait 2.0


# ─────────────────────────────────────────────
# Bell
# ─────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0


# ─────────────────────────────────────────────
# Misc
# ─────────────────────────────────────────────
confirm_os_window_close 0

# Перечитывать конфиг автоматически
auto_reload_config 1

map ctrl+shift+n new_os_window_with_cwd
